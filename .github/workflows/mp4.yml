name: Download MP4 and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      FILE_URL:
        description: "Masukkan URL file MP4 atau M3U8"
        required: true
        type: string
      OUTPUT_NAME:
        description: "Nama file output (tanpa ekstensi). Contoh: video_saya"
        required: false
        default: "output"
        type: string

jobs:
  download-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl aria2 ffmpeg
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup rclone config (decode base64)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF_B64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Create downloads folder
        run: mkdir -p downloads

      - name: Detect if URL is MP4 or M3U8 and Process
        run: |
          URL="${{ github.event.inputs.FILE_URL }}"
          OUTPUT="${{ github.event.inputs.OUTPUT_NAME }}"

          if [[ "$URL" == *.m3u8 ]]; then
            echo "URL adalah M3U8 → memakai ffmpeg untuk convert..."
            ffmpeg -i "$URL" -c copy "downloads/$OUTPUT.mp4"
          else
            echo "URL bukan M3U8 → download langsung..."

            # Extract Referer (remove /download if exists)
            REFERER="${URL/\/download/}"
            USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Safari/537.36"

            # Resolve the final download URL by extracting the Location header via a GET request (HEAD might be blocked)
            FINAL_URL=$(curl -s -D - -o /dev/null -r 0-0 "$URL" -H "Referer: $REFERER" -H "User-Agent: $USER_AGENT" | grep -i "location:" | head -n 1 | awk '{print $2}' | tr -d '\r')

            if [ -z "$FINAL_URL" ]; then
              FINAL_URL="$URL"
            fi

            echo "Resolved Final URL: $FINAL_URL"

            # Get headers from FINAL_URL to determine the real extension (using GET instead of HEAD)
            HEADERS=$(curl -s -D - -o /dev/null -r 0-0 "$FINAL_URL" -H "Referer: $REFERER" -H "User-Agent: $USER_AGENT")
            FILENAME=$(echo "$HEADERS" | grep -i "content-disposition:" | sed -n 's/.*filename="\([^"]*\)".*/\1/p' | tr -d '\r')

            if [ -n "$FILENAME" ] && [[ "$FILENAME" == *.* ]]; then
              EXT="${FILENAME##*.}"
            else
              # Fallback: extract extension from FINAL_URL safely
              URL_PATH=$(echo "$FINAL_URL" | awk -F'?' '{print $1}')
              BASENAME=$(basename "$URL_PATH")
              if [[ "$BASENAME" == *.* ]]; then
                EXT="${BASENAME##*.}"
              else
                EXT=""
              fi

              if [[ -z "$EXT" ]]; then
                EXT="mp4"
              fi
            fi

            echo "Detected extension: $EXT"

            # If user left OUTPUT_NAME as "output" and we found a real FILENAME, we could optionally use the real filename.
            # But based on input defaults, we will use $OUTPUT.$EXT

            aria2c -x 16 -s 16 -k 1M --header="Referer: $REFERER" --header="User-Agent: $USER_AGENT" "$FINAL_URL" -d "downloads" -o "$OUTPUT.$EXT"
          fi

      - name: Upload to Google Drive
        run: |
          rclone copy downloads/ gdrive:backup-folder --progress

      - name: Cleanup local files
        run: rm -rf downloads
