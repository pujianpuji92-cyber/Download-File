name: Universal File Downloader and Upload to Google Drive

on:
  workflow_dispatch:
    inputs:
      FILE_URL:
        description: "URL file yang ingin didownload"
        required: true
        type: string

      OUTPUT_NAME:
        description: "Nama file tanpa ekstensi. Contoh: Tumbal.Proyek.2026.1080p.NF.WEB-DL.AAC2.0.H.264-KQRM"
        required: true
        type: string

jobs:
  download-upload:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # INSTALL DEPENDENCIES
      # ==========================================
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            aria2 \
            file \
            ffmpeg \
            ca-certificates

          curl https://rclone.org/install.sh | sudo bash


      # ==========================================
      # SETUP RCLONE
      # ==========================================
      - name: Setup rclone config
        run: |
          mkdir -p ~/.config/rclone

          echo "${{ secrets.RCLONE_CONF_B64 }}" \
            | base64 -d \
            > ~/.config/rclone/rclone.conf

          chmod 600 ~/.config/rclone/rclone.conf


      # ==========================================
      # CREATE DOWNLOAD DIRECTORY
      # ==========================================
      - name: Create downloads folder
        run: |
          mkdir -p downloads


      # ==========================================
      # UNIVERSAL DOWNLOADER
      # ==========================================
      - name: Download file
        env:
          FILE_URL: ${{ inputs.FILE_URL }}
          OUTPUT_NAME: ${{ inputs.OUTPUT_NAME }}

        run: |

          set -e

          URL="$FILE_URL"
          NAME="$OUTPUT_NAME"

          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"

          # ------------------------------------------
          # REFERER
          # ------------------------------------------

          REFERER="${URL/\/download/}"

          echo "=========================================="
          echo " UNIVERSAL DOWNLOADER"
          echo "=========================================="
          echo "URL     : $URL"
          echo "Referer : $REFERER"
          echo "Name    : $NAME"
          echo "=========================================="


          # ==========================================
          # CHECK RESPONSE HEADERS
          # ==========================================

          echo ""
          echo "▶ Checking server..."

          curl \
            -sS \
            -L \
            -r 0-0 \
            -D headers.txt \
            -o /dev/null \
            --max-redirs 10 \
            -H "Referer: $REFERER" \
            -H "User-Agent: $USER_AGENT" \
            "$URL"

          echo ""
          echo "========== SERVER HEADERS =========="
          cat headers.txt
          echo "===================================="


          # ==========================================
          # CONTENT TYPE
          # ==========================================

          CONTENT_TYPE=$(grep -i "^content-type:" headers.txt \
            | tail -n 1 \
            | cut -d: -f2- \
            | tr -d '\r' \
            | xargs \
            | cut -d';' -f1 \
            | tr '[:upper:]' '[:lower:]')

          echo ""
          echo "Content-Type: ${CONTENT_TYPE:-unknown}"


          # ==========================================
          # CONTENT LENGTH
          # ==========================================

          CONTENT_LENGTH=$(grep -i "^content-length:" headers.txt \
            | tail -n 1 \
            | cut -d: -f2- \
            | tr -d '\r' \
            | xargs)

          echo "Content-Length: ${CONTENT_LENGTH:-unknown}"


          # ==========================================
          # CONTENT DISPOSITION
          # ==========================================

          SERVER_FILENAME=$(grep -i "content-disposition:" headers.txt \
            | tail -n 1 \
            | sed -n 's/.*filename="\([^"]*\)".*/\1/p' \
            | tr -d '\r')

          echo "Server filename: ${SERVER_FILENAME:-unknown}"


          # ==========================================
          # DETECT M3U8
          # ==========================================

          URL_LOWER=$(echo "$URL" | tr '[:upper:]' '[:lower:]')

          if [[ "$URL_LOWER" == *.m3u8* ]]; then

            echo ""
            echo "=========================================="
            echo " HLS / M3U8 DETECTED"
            echo "=========================================="

            echo "Downloading HLS stream..."

            ffmpeg \
              -hide_banner \
              -loglevel info \
              -headers "Referer: $REFERER"$'\r\n'"User-Agent: $USER_AGENT"$'\r\n' \
              -i "$URL" \
              -map 0 \
              -c copy \
              "downloads/${NAME}.mkv"

            echo ""
            echo "HLS download completed."

          else

            # ========================================
            # DIRECT FILE
            # ========================================

            echo ""
            echo "=========================================="
            echo " DIRECT FILE"
            echo "=========================================="

            echo "No conversion will be performed."


            # ========================================
            # DETERMINE EXTENSION
            # ========================================

            EXT=""


            # ----------------------------------------
            # 1. Content-Disposition
            # ----------------------------------------

            if [ -n "$SERVER_FILENAME" ]; then

              if [[ "$SERVER_FILENAME" == *.* ]]; then
                EXT="${SERVER_FILENAME##*.}"
              fi

            fi


            # ----------------------------------------
            # 2. Content-Type
            # ----------------------------------------

            if [ -z "$EXT" ]; then

              case "$CONTENT_TYPE" in

                video/x-matroska)
                  EXT="mkv"
                  ;;

                video/mp4)
                  EXT="mp4"
                  ;;

                video/webm)
                  EXT="webm"
                  ;;

                video/x-msvideo)
                  EXT="avi"
                  ;;

                video/quicktime)
                  EXT="mov"
                  ;;

                video/mpeg)
                  EXT="mpeg"
                  ;;

                video/mp2t)
                  EXT="ts"
                  ;;

                audio/mpeg)
                  EXT="mp3"
                  ;;

                audio/mp4)
                  EXT="m4a"
                  ;;

                audio/flac)
                  EXT="flac"
                  ;;

                audio/wav|audio/x-wav)
                  EXT="wav"
                  ;;

                application/zip)
                  EXT="zip"
                  ;;

                application/x-rar-compressed)
                  EXT="rar"
                  ;;

                application/pdf)
                  EXT="pdf"
                  ;;

                application/json)
                  EXT="json"
                  ;;

                text/plain)
                  EXT="txt"
                  ;;

              esac

            fi


            # ----------------------------------------
            # 3. URL extension
            # ----------------------------------------

            if [ -z "$EXT" ]; then

              CLEAN_URL=$(echo "$URL" | sed 's/[?#].*$//')

              URL_FILENAME=$(basename "$CLEAN_URL")

              if [[ "$URL_FILENAME" == *.* ]]; then

                EXT="${URL_FILENAME##*.}"

              fi

            fi


            # ----------------------------------------
            # Sanitize extension
            # ----------------------------------------

            EXT=$(echo "$EXT" \
              | tr '[:upper:]' '[:lower:]' \
              | tr -cd '[:alnum:]')


            # ========================================
            # DOWNLOAD
            # ========================================

            TEMP_FILE="downloads/${NAME}.download"

            echo ""
            echo "▶ Starting download..."
            echo "▶ Temporary file: $TEMP_FILE"

            aria2c \
              --continue=true \
              --allow-overwrite=true \
              --auto-file-renaming=false \
              --file-allocation=none \
              --max-tries=10 \
              --retry-wait=5 \
              --timeout=60 \
              --connect-timeout=30 \
              --split=16 \
              --max-connection-per-server=16 \
              --min-split-size=1M \
              --check-integrity=true \
              --summary-interval=10 \
              --console-log-level=notice \
              --header="Referer: $REFERER" \
              --header="User-Agent: $USER_AGENT" \
              "$URL" \
              -d downloads \
              -o "${NAME}.download"


            # ========================================
            # VERIFY DOWNLOAD
            # ========================================

            echo ""
            echo "=========================================="
            echo " VERIFYING DOWNLOADED FILE"
            echo "=========================================="

            if [ ! -f "$TEMP_FILE" ]; then
              echo "ERROR: Downloaded file does not exist."
              exit 1
            fi

            FILE_SIZE=$(stat -c%s "$TEMP_FILE")

            echo "Downloaded size: $FILE_SIZE bytes"

            if [ "$FILE_SIZE" -lt 10000 ]; then

              echo ""
              echo "WARNING: Downloaded file is unusually small."
              echo ""
              echo "File information:"
              file "$TEMP_FILE"

              echo ""
              echo "First 1000 bytes:"
              head -c 1000 "$TEMP_FILE" || true

              echo ""
              echo "The server may have returned an error page."

              exit 1

            fi


            # ========================================
            # FILE SIGNATURE
            # ========================================

            echo ""
            echo "File signature:"

            file "$TEMP_FILE"


            # ========================================
            # DETECT EXTENSION FROM FILE SIGNATURE
            # ========================================

            if [ -z "$EXT" ]; then

              FILE_INFO=$(file "$TEMP_FILE")

              case "$FILE_INFO" in

                *Matroska*)
                  EXT="mkv"
                  ;;

                *WebM*)
                  EXT="webm"
                  ;;

                *"ISO Media"*)
                  EXT="mp4"
                  ;;

                *MP4*)
                  EXT="mp4"
                  ;;

                *"MPEG transport stream"*)
                  EXT="ts"
                  ;;

                *"Audio file with ID3"*)
                  EXT="mp3"
                  ;;

                *FLAC*)
                  EXT="flac"
                  ;;

                *WAVE*)
                  EXT="wav"
                  ;;

                *PDF*)
                  EXT="pdf"
                  ;;

                *Zip*)
                  EXT="zip"
                  ;;

                *RAR*)
                  EXT="rar"
                  ;;

                *JPEG*)
                  EXT="jpg"
                  ;;

                *PNG*)
                  EXT="png"
                  ;;

                *GIF*)
                  EXT="gif"
                  ;;

                *)
                  EXT="bin"
                  ;;

              esac

            fi


            # ========================================
            # FINALIZE FILE
            # ========================================

            FINAL_FILE="downloads/${NAME}.${EXT}"

            echo ""
            echo "=========================================="
            echo " FINAL FILE"
            echo "=========================================="

            echo "Extension : .$EXT"
            echo "Output    : $FINAL_FILE"

            mv \
              "$TEMP_FILE" \
              "$FINAL_FILE"


            # ========================================
            # FINAL VERIFICATION
            # ========================================

            echo ""
            echo "Final file:"

            ls -lh "$FINAL_FILE"

            echo ""
            file "$FINAL_FILE"

          fi


      # ==========================================
      # LIST FILES
      # ==========================================
      - name: Show downloaded files
        run: |
          echo "=========================================="
          echo " DOWNLOADED FILES"
          echo "=========================================="

          ls -lah downloads/


      # ==========================================
      # UPLOAD TO GOOGLE DRIVE
      # ==========================================
      - name: Upload to Google Drive
        run: |

          echo "=========================================="
          echo " UPLOADING TO GOOGLE DRIVE"
          echo "=========================================="

          rclone copy \
            downloads/ \
            gdrive:backup-folder \
            --progress \
            --transfers=2 \
            --checkers=8

          echo ""
          echo "Upload completed."


      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -rf downloads
